name: Build & Release

on:
 
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  
env:
     PYTHONUTF8: "1"
     PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Librerie Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Componenti nativi (mpv, ffmpeg, aria2, yt-dlp)
        run: python setup_deps.py --latest

      - name: Icona
        run: python -c "import setup_deps; setup_deps.make_icon()"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: NOVA.exe
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name NOVA --icon "assets\nova.ico"
          --paths . --collect-submodules app --hidden-import mpv --hidden-import libtorrent --hidden-import qrcode
          --exclude-module tkinter --exclude-module numpy --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtPdf --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtSql main.py
          && xcopy /e /i /y /q bin "dist\NOVA\bin"
          && xcopy /e /i /y /q assets "dist\NOVA\assets"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "build_tools\NOVA.iss"

      - name: Versione portatile (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\NOVA\* -DestinationPath dist\NOVA-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-windows
          path: |
            dist/NOVA-Setup.exe
            dist/NOVA-portable.zip

      - name: Pubblica nella Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOVA-Setup.exe
            dist/NOVA-portable.zip
